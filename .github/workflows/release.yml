name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to upload, for example v0.1.0. Leave blank to build a downloadable workflow artifact only."
        required: false
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || inputs.tag || github.run_id }}
  cancel-in-progress: false

jobs:
  windows-portable:
    runs-on: windows-latest
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Check release version
        run: node scripts/check-release-version.mjs "${{ github.event_name == 'push' && github.ref_name || inputs.tag }}"

      - name: Configure signing
        id: signing
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          $missing = @()
          foreach ($name in @("AZURE_CLIENT_ID", "AZURE_TENANT_ID", "AZURE_SUBSCRIPTION_ID")) {
            if (-not (Get-Item "env:$name" -ErrorAction SilentlyContinue).Value) {
              $missing += $name
            }
          }

          if ($missing.Count -eq 0) {
            "enabled=1" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Azure OIDC signing configuration present; signing enabled."
          } else {
            "enabled=0" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Azure OIDC signing configuration incomplete ($($missing -join ', ')); building unsigned."
          }

      - name: Azure login for signing
        if: ${{ steps.signing.outputs.enabled == '1' }}
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: true

      - name: Enable signing
        if: ${{ steps.signing.outputs.enabled == '1' }}
        shell: pwsh
        run: |
          "KINAGENT_SIGN=1" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build Windows artifacts
        env:
          KINAGENT_AZURE_PUBLISHER_NAME: ${{ vars.KINAGENT_AZURE_PUBLISHER_NAME }}
          KINAGENT_AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ vars.KINAGENT_AZURE_TRUSTED_SIGNING_ENDPOINT }}
          KINAGENT_AZURE_SIGNING_ACCOUNT_NAME: ${{ vars.KINAGENT_AZURE_SIGNING_ACCOUNT_NAME }}
          KINAGENT_AZURE_CERTIFICATE_PROFILE_NAME: ${{ vars.KINAGENT_AZURE_CERTIFICATE_PROFILE_NAME }}
        run: npm run dist:win

      - name: Build campaign pack downloads
        run: npm run campaigns:build

      - name: Locate Windows artifacts
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $portable = Get-Item -Path "release/Kinagent-$version-portable.exe" -ErrorAction SilentlyContinue
          if (-not $portable) {
            throw "Portable Kinagent exe for version $version was not found in release/."
          }
          $installer = Get-Item -Path "release/Kinagent-$version-setup.exe" -ErrorAction SilentlyContinue
          if (-not $installer) {
            throw "Installer Kinagent exe for version $version was not found in release/."
          }
          "PORTABLE_EXE=$($portable.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PORTABLE_NAME=$($portable.Name)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "INSTALLER_EXE=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "INSTALLER_NAME=$($installer.Name)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Verify signatures
        if: ${{ steps.signing.outputs.enabled == '1' }}
        shell: pwsh
        run: |
          foreach ($exe in @($env:PORTABLE_EXE, $env:INSTALLER_EXE)) {
            $sig = Get-AuthenticodeSignature $exe
            if ($sig.Status -ne 'Valid') {
              throw "Authenticode signature not valid for $exe (status: $($sig.Status))."
            }
            Write-Host "Signed OK: $exe -> $($sig.SignerCertificate.Subject)"
          }

      - name: Upload portable workflow artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ env.PORTABLE_NAME }}
          path: ${{ env.PORTABLE_EXE }}
          if-no-files-found: error

      - name: Upload installer workflow artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ env.INSTALLER_NAME }}
          path: ${{ env.INSTALLER_EXE }}
          if-no-files-found: error

      - name: Upload campaign pack workflow artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: kinagent-campaign-packs
          path: release/campaigns/*
          if-no-files-found: error

      - name: Publish GitHub release asset
        if: ${{ github.event_name == 'push' || inputs.tag != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart("v")
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG $env:PORTABLE_EXE --clobber
            gh release upload $env:RELEASE_TAG $env:INSTALLER_EXE --clobber
          } else {
            gh release create $env:RELEASE_TAG $env:PORTABLE_EXE $env:INSTALLER_EXE `
              --title "Kinagent $version" `
              --notes "Windows portable and installer builds for Kinagent $version." `
              --target $env:GITHUB_SHA
          }
          gh release upload $env:RELEASE_TAG release/campaigns/* --clobber
