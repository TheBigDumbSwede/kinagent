kindroid:
  # Official Kindroid API key from Profile Settings. Starts with kn_.
  # If omitted, Kinagent falls back to the saved browser Firebase session for legacy observed write paths.
  apiKey: ""
  firebaseProjectId: "kindroid-ai"
  uid: ""
  kins:
    - name: "Example Kin"
      aiId: ""
      enabled: true

bridge:
  dedupeWindowSeconds: 180
  logPath: "./data/kinagent.log"
  logLevel: "info"
  sessionDir: "./data/browser-session"
  sqlitePath: "./data/bridge.sqlite"

hermes:
  enabled: false
  baseUrl: "http://127.0.0.1:8642/v1"
  apiKey: ""
  agentId: "kindroid-bridge"
  currentSceneUpdates:
    enabled: true
    maxLength: 160
  journalSuggestions:
    enabled: true
    throttleMessages: 20
    strongEventBypass: true
  groupBackgrounds:
    suggestions:
      enabled: false
      autonomous: false
      minMessagesBetweenProposals: 12
      minSignificance: 0.7
    images:
      enabled: true
      provider: "openai"
      openai:
        apiKey: ""
        model: "gpt-image-1"
        size: "1536x1024"
        quality: "medium"
  chatDynamism:
    suggestions:
      enabled: true
    autoAdjust:
      enabled: false
      minTurnsBetweenAdjustments: 12
      min: 0.8
      max: 1.4
      maxDelta: 0.2

voice:
  enabled: false
  provider: "none" # none, openai, or elevenlabs
  openai:
    apiKey: ""
    model: "gpt-4o-mini-tts"
    voice: "marin"
    instructions: ""
  elevenlabs:
    apiKey: ""
    model: "eleven_flash_v2_5"
    outputFormat: "mp3_44100_128"
