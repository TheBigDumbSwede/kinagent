<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kinagent</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">K</div>
          <div>
            <h1>Kinagent</h1>
            <p id="sessionLine">Session unknown</p>
          </div>
        </div>

        <section class="panel">
          <h2>Session</h2>
          <div class="button-row">
            <button id="loginStartButton" type="button">Open Login</button>
            <button id="loginSaveButton" type="button">Save Session</button>
          </div>
          <button id="openKindroidButton" class="secondary" type="button">Open Kindroid</button>
          <dl class="status-list">
            <div>
              <dt>Firebase</dt>
              <dd id="firebaseStatus">Unknown</dd>
            </div>
            <div>
              <dt>App Check</dt>
              <dd id="appCheckStatus">Unknown</dd>
            </div>
            <div>
              <dt>Expires</dt>
              <dd id="expiryStatus">Unknown</dd>
            </div>
          </dl>
        </section>

        <section class="panel">
          <div class="panel-heading">
            <h2>Kins</h2>
            <div class="panel-actions">
              <button id="toggleKinsButton" class="secondary compact" type="button" aria-expanded="false">
                Manage
              </button>
              <button id="refreshKinsButton" class="secondary compact" type="button">Refresh</button>
            </div>
          </div>
          <p id="kinRefreshLine" class="panel-note">Waiting for Kin list</p>
          <div id="kinSubscriptionList" class="kin-list"></div>
        </section>

        <section class="panel">
          <div class="panel-heading">
            <h2>Groups</h2>
            <div class="panel-actions">
              <button id="toggleGroupsButton" class="secondary compact" type="button" aria-expanded="false">
                Manage
              </button>
              <button id="refreshGroupsButton" class="secondary compact" type="button">Refresh</button>
            </div>
          </div>
          <p id="groupRefreshLine" class="panel-note">Waiting for group list</p>
          <div id="groupSubscriptionList" class="kin-list"></div>
        </section>
      </aside>

      <section class="activity">
        <div class="activity-header">
          <div>
            <h2>Incoming Messages</h2>
            <p id="monitorLine">Monitor stopped</p>
          </div>
          <button id="clearButton" class="secondary" type="button">Clear</button>
        </div>
        <div id="messageList" class="message-list"></div>
      </section>
    </main>
    <script src="./renderer.js"></script>
  </body>
</html>
